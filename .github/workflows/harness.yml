name: harness gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "docs/AGENTS.md"
      - "docs/README.md"
      - ".agents/**"
      - "docs/process/**"
      - "docs/domain/**"
      - "docs/requirements/**"
      - "docs/architecture/**"
      - "docs/decisions/**"
      - "docs/plans/**"
      - "tools/validate_harness.py"
      - "Makefile"
      - ".github/workflows/harness.yml"
  pull_request:
    types: [ready_for_review]
    paths:
      - "AGENTS.md"
      - "docs/AGENTS.md"
      - "docs/README.md"
      - ".agents/**"
      - "docs/process/**"
      - "docs/domain/**"
      - "docs/requirements/**"
      - "docs/architecture/**"
      - "docs/decisions/**"
      - "docs/plans/**"
      - "tools/validate_harness.py"
      - "Makefile"
      - ".github/workflows/harness.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make harness-check
