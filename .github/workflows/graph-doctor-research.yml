name: Graph Doctor Research

on:
  push:
    branches: [research/graph-doctor-v1]
    paths:
      - ".harness/engineering-graph.yaml"
      - ".harness/graph.yaml"
      - ".github/workflows/graph-doctor-research.yml"
  pull_request:
    paths:
      - ".harness/engineering-graph.yaml"
      - ".harness/graph.yaml"
      - ".github/workflows/graph-doctor-research.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Checkout Harness Graph Doctor research
        uses: actions/checkout@v5
        with:
          repository: lehater/harness
          ref: af61b0ef36372e55c9d0760e86af80199f6623d2
          path: .graph-doctor-harness
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
      - run: python -m pip install PyYAML
      - name: Diagnose Nutrition engineering graph
        run: |
          set +e
          python .graph-doctor-harness/graph_doctor.py             .harness/engineering-graph.yaml             --core-model .harness/graph.yaml             --target IMPLEMENTATION             --source-root .             --json | tee /tmp/graph-doctor.json
          code=$?
          set -e
          python - <<'PY'
          import json
          report=json.load(open("/tmp/graph-doctor.json"))
          print(json.dumps(report["summary"], indent=2))
          print(json.dumps(report["findings"], indent=2))
          assert report["summary"] == {"ERROR": 0, "WARN": 0, "INFO": 0}, report
          PY
          exit 0
