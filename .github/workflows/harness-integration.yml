name: Harness Integration

on:
  pull_request:
    paths:
      - ".harness/**"
      - ".harness-version"
      - "docs/redesign/repository-realization.yaml"
      - ".github/workflows/harness-integration.yml"
  push:
    branches: [main]
    paths:
      - ".harness/**"
      - ".harness-version"
      - "docs/redesign/repository-realization.yaml"
      - ".github/workflows/harness-integration.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Nutrition Management
        uses: actions/checkout@v5

      - name: Read pinned Harness version
        id: harness-version
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Harness
        uses: actions/checkout@v5
        with:
          repository: lehater/harness
          ref: ${{ steps.harness-version.outputs.sha }}
          path: .harness-tool

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"

      - name: Install Harness runtime dependency
        run: python -m pip install PyYAML

      - name: Validate repository realization
        run: python .harness-tool/repository_realization.py docs/redesign/repository-realization.yaml

      - name: Validate Engineering Graph
        run: python .harness-tool/engineering_graph.py validate .harness/engineering-graph.yaml

      - name: Validate Core realization
        run: python .harness-tool/harness.py validate .harness/graph.yaml

      - name: Validate frontend design closure
        run: python .harness/check_frontend_design_closure.py

      - name: Diagnose backend graph health
        run: |
          python .harness-tool/graph_doctor.py \
            .harness/engineering-graph.yaml \
            --core-model .harness/graph.yaml \
            --target IMPLEMENTATION \
            --source-root .

      - name: Diagnose frontend graph health
        run: |
          python .harness-tool/graph_doctor.py \
            .harness/engineering-graph.yaml \
            --core-model .harness/graph.yaml \
            --target FRONTEND-IMPLEMENTATION \
            --source-root .

      - name: Validate human documentation projection recipes
        run: |
          python .harness-tool/human_projection.py compile \
            .harness/engineering-graph.yaml \
            IMPLEMENTATION \
            --core-model .harness/graph.yaml \
            --recipe .harness/human-projection/backend.yaml \
            --source-root . \
            --output-manifest /tmp/backend-human-manifest.yaml \
            --output-plan /tmp/backend-human-plan.yaml
          python .harness-tool/human_projection.py compile \
            .harness/engineering-graph.yaml \
            FRONTEND-IMPLEMENTATION \
            --core-model .harness/graph.yaml \
            --recipe .harness/human-projection/frontend.yaml \
            --source-root . \
            --output-manifest /tmp/frontend-human-manifest.yaml \
            --output-plan /tmp/frontend-human-plan.yaml

      - name: Evaluate canonical consumers
        run: |
          python .harness-tool/engineering_graph.py evaluate .harness/engineering-graph.yaml IMPLEMENTATION .harness/graph.yaml
          python .harness-tool/engineering_graph.py evaluate .harness/engineering-graph.yaml THEORETICAL-GAP-SUGGESTIONS .harness/graph.yaml
          python .harness-tool/engineering_graph.py evaluate .harness/engineering-graph.yaml NUTRIENT-EVIDENCE-PROPAGATION .harness/graph.yaml
          python .harness-tool/engineering_graph.py evaluate .harness/engineering-graph.yaml BLS-V4-PRODUCTION-IMPORT .harness/graph.yaml
          python .harness-tool/engineering_graph.py evaluate .harness/engineering-graph.yaml FRONTEND-IMPLEMENTATION .harness/graph.yaml

      - name: Route frontend target
        run: |
          python .harness-tool/agent_router.py             .harness/engineering-graph.yaml             FRONTEND-IMPLEMENTATION             .harness/graph.yaml             --registry .harness-tool/skills/artifact-skill-registry-v0.yaml
