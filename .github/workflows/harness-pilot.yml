name: Harness pilot

on:
  pull_request:
    paths:
      - ".harness/**"
      - "docs/generated/**"
      - ".github/workflows/harness-pilot.yml"

permissions:
  contents: read

jobs:
  validate-harness-workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Nutrition Management
        uses: actions/checkout@v5

      - name: Checkout pinned Harness
        uses: actions/checkout@v5
        with:
          repository: lehater/harness
          ref: 3e55f06f9089a1d8e97cfb5883a54478fb54fc4b
          path: .harness-tool

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"

      - name: Install Harness runtime dependency
        run: python -m pip install PyYAML

      - name: Validate target state and managed knowledge
        run: python .harness-tool/workspace.py validate .

      - name: Verify gap-suggestions design is complete
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          sys.path.insert(0, ".harness-tool")
          from target_state import evaluate_target_state

          profile = yaml.safe_load(
              Path(".harness/profiles/theoretical-gap-suggestions.yaml").read_text()
          )
          model = yaml.safe_load(Path(".harness/graph.yaml").read_text())
          result = evaluate_target_state(profile, model)
          assert result["status"] == "COMPLETE", result
          assert result["create"] == [], result
          assert result["wait"] == [], result
          assert result["pending"] == [], result
          PY
      - name: Verify nutrient-evidence propagation design is complete
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          sys.path.insert(0, ".harness-tool")
          from target_state import evaluate_target_state

          profile = yaml.safe_load(
              Path(".harness/profiles/nutrient-evidence-propagation.yaml").read_text()
          )
          model = yaml.safe_load(Path(".harness/graph.yaml").read_text())
          result = evaluate_target_state(profile, model)
          assert result["status"] == "COMPLETE", result
          assert result["create"] == [], result
          assert result["wait"] == [], result
          assert result["pending"] == [], result
          PY


      - name: Evaluate BLS import slice
        run: python .harness-tool/target_state.py .harness/profiles/bls-v4-production-import.yaml .harness/graph.yaml

      - name: Verify BLS source-set and Question frontier
        run: |
          python - <<'PY'
          import copy
          import sys
          from pathlib import Path
          import yaml

          sys.path.insert(0, ".harness-tool")
          from target_state import evaluate_target_state

          profile = yaml.safe_load(Path(".harness/profiles/bls-v4-production-import.yaml").read_text())
          model = yaml.safe_load(Path(".harness/graph.yaml").read_text())

          current = evaluate_target_state(profile, model)
          assert current["status"] == "READY", current
          assert {item["expectation"] for item in current["create"]} == {"SOURCE-CODE-SET"}, current
          assert current["wait"] == [], current
          current_pending = {item["expectation"] for item in current["pending"]}
          assert current_pending == {
              "CATEGORY-ASSIGNMENT",
              "PRODUCTION-PACKAGE-CONTRACT",
              "IMPORT-VERIFICATION",
          }, current

          with_source_set = copy.deepcopy(model)
          with_source_set["artifacts"].append(
              {
                  "id": "BLS-V4-SOURCE-CODE-SET",
                  "authority": "FOOD-KNOWLEDGE",
                  "path": "data/food/bls-4.0/source_codes.json",
                  "provides": [
                      "nutrition-management.food-knowledge.bls-v4.source-code-set"
                  ],
                  "depends_on": ["BLS-V4-SOURCE-BASELINE"],
              }
          )

          resolved = evaluate_target_state(profile, with_source_set)
          assert resolved["status"] == "READY", resolved
          assert {item["expectation"] for item in resolved["create"]} == {"CATEGORY-ASSIGNMENT"}, resolved
          assert resolved["wait"] == [], resolved

          unresolved = copy.deepcopy(with_source_set)
          for question in unresolved["questions"]:
              if question["id"] == "Q-BLS-V4-CATEGORY-ASSIGNMENT":
                  question.pop("resolution", None)

          blocked = evaluate_target_state(profile, unresolved)
          assert blocked["status"] == "BLOCKED", blocked
          assert blocked["create"] == [], blocked
          wait = {item["expectation"]: item for item in blocked["wait"]}
          assert wait["CATEGORY-ASSIGNMENT"]["providers"] == [], wait
          assert wait["CATEGORY-ASSIGNMENT"]["questions"] == [
              "Q-BLS-V4-CATEGORY-ASSIGNMENT"
          ], wait
          blocked_pending = {item["expectation"] for item in blocked["pending"]}
          assert blocked_pending == {
              "PRODUCTION-PACKAGE-CONTRACT",
              "IMPORT-VERIFICATION",
          }, blocked
          PY

      - name: Re-render human documentation
        run: python .harness-tool/workspace.py render .

      - name: Verify generated documentation is current
        run: git diff --exit-code -- docs/generated
