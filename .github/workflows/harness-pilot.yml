name: Harness pilot

on:
  pull_request:
    paths:
      - ".harness/**"
      - "docs/generated/**"
      - ".github/workflows/harness-pilot.yml"

permissions:
  contents: read

jobs:
  validate-harness-workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Nutrition Management
        uses: actions/checkout@v5

      - name: Checkout pinned Harness
        uses: actions/checkout@v5
        with:
          repository: lehater/harness
          ref: 3b5047230e015ed9abbfc8a2439177bd034ee276
          path: .harness-tool

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"

      - name: Install Harness runtime dependency
        run: python -m pip install PyYAML

      - name: Validate target state and managed knowledge
        run: python .harness-tool/workspace.py validate .

      - name: Evaluate BLS import slice
        run: python .harness-tool/target_state.py .harness/profiles/bls-v4-production-import.yaml .harness/graph.yaml

      - name: Verify BLS Question to CREATE transition
        run: |
          python - <<'PY'
          import copy
          import sys
          from pathlib import Path
          import yaml

          sys.path.insert(0, ".harness-tool")
          from target_state import evaluate_target_state

          profile = yaml.safe_load(Path(".harness/profiles/bls-v4-production-import.yaml").read_text())
          model = yaml.safe_load(Path(".harness/graph.yaml").read_text())

          unresolved = copy.deepcopy(model)
          for question in unresolved["questions"]:
              if question["id"] == "Q-BLS-V4-CATEGORY-ASSIGNMENT":
                  question.pop("resolution", None)

          blocked = evaluate_target_state(profile, unresolved)
          assert blocked["status"] == "BLOCKED", blocked
          assert blocked["create"] == [], blocked
          wait = {item["expectation"]: item for item in blocked["wait"]}
          assert wait["CATEGORY-ASSIGNMENT"]["providers"] == [], wait
          assert wait["CATEGORY-ASSIGNMENT"]["questions"] == ["Q-BLS-V4-CATEGORY-ASSIGNMENT"], wait

          resolved = evaluate_target_state(profile, model)
          assert resolved["status"] == "READY", resolved
          create = {item["expectation"]: item for item in resolved["create"]}
          assert set(create) == {"CATEGORY-ASSIGNMENT"}, resolved
          assert create["CATEGORY-ASSIGNMENT"]["capability"] == "nutrition-management.food-knowledge.bls-v4.category-assignment"
          assert resolved["wait"] == [], resolved
          pending = {item["expectation"] for item in resolved["pending"]}
          assert pending == {"PRODUCTION-PACKAGE-CONTRACT", "IMPORT-VERIFICATION"}, resolved
          PY

      - name: Re-render human documentation
        run: python .harness-tool/workspace.py render .

      - name: Verify generated documentation is current
        run: git diff --exit-code -- docs/generated
