name: CI

on:
  pull_request:
  push:
    branches:
      - impl/first-planning-slice

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Install uv
        run: python -m pip install 'uv==0.12.13'
      - name: Resolve dependencies
        run: uv lock
      - name: Sync environment
        run: uv sync --all-groups
      - name: Record runtime versions
        run: |
          uv run python --version
          uv run python - <<'PY'
          import sqlalchemy
          import alembic
          import pyscipopt
          import pytest
          print('SQLAlchemy', sqlalchemy.__version__)
          print('Alembic', alembic.__version__)
          print('PySCIPOpt', pyscipopt.__version__)
          print('pytest', pytest.__version__)
          model = pyscipopt.Model()
          print('SCIP', model.getMajorVersion(), model.getMinorVersion(), model.getTechVersion())
          PY
      - name: Run tests
        run: uv run pytest
      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: uv.lock
          if-no-files-found: error
