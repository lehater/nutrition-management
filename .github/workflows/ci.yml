name: CI

on:
  pull_request:
  push:
    branches:
      - impl/first-planning-slice

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Install uv
        run: python -m pip install 'uv==0.12.13'
      - name: Resolve or verify dependencies
        id: lock
        shell: bash
        run: |
          if [[ -f uv.lock ]]; then
            uv lock --check
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            uv lock
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Sync environment
        run: uv sync --all-groups --locked
      - name: Record runtime versions
        run: |
          uv run python --version
          uv run python - <<'PY'
          import sqlalchemy
          import alembic
          import pyscipopt
          import pytest
          print('SQLAlchemy', sqlalchemy.__version__)
          print('Alembic', alembic.__version__)
          print('PySCIPOpt', pyscipopt.__version__)
          print('pytest', pytest.__version__)
          model = pyscipopt.Model()
          print('SCIP', model.getMajorVersion(), model.getMinorVersion(), model.getTechVersion())
          PY
      - name: Run tests
        run: uv run pytest
      - name: Commit generated lockfile
        if: steps.lock.outputs.generated == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'Lock implementation dependencies [skip ci]'
          git push
