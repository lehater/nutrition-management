name: Engineering Graph v0 pilot

on:
  pull_request:
    paths:
      - ".harness/**"
      - ".github/workflows/engineering-graph-v0.yml"
  push:
    paths:
      - ".harness/**"
      - ".github/workflows/engineering-graph-v0.yml"

permissions:
  contents: read

jobs:
  validate-engineering-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Nutrition Management
        uses: actions/checkout@v5

      - name: Checkout pinned Engineering Graph Harness
        uses: actions/checkout@v5
        with:
          repository: lehater/harness
          ref: 8b88580bdeb38b844cbb896531281b2fb1745700
          path: .harness-tool

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"

      - name: Install Harness runtime dependency
        run: python -m pip install PyYAML

      - name: Validate Engineering Graph
        run: python .harness-tool/engineering_graph.py validate .harness/engineering-graph.yaml

      - name: Verify implementation target is derived complete
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          sys.path.insert(0, ".harness-tool")
          from engineering_graph import evaluate_engineering_target

          graph = yaml.safe_load(Path(".harness/engineering-graph.yaml").read_text())
          model = yaml.safe_load(Path(".harness/graph.yaml").read_text())
          result = evaluate_engineering_target(graph, "IMPLEMENTATION", model)

          assert result["status"] == "COMPLETE", result
          assert result["create"] == [], result
          assert result["wait"] == [], result
          assert result["pending"] == [], result

          capabilities = {
              item["capability"] for item in result["profile"]["expectations"]
          }
          assert "nutrition-management.problem" in capabilities
          assert "nutrition-management.requirements" in capabilities
          assert "nutrition-management.architecture" in capabilities
          assert "nutrition-management.verification.strategy" in capabilities
          PY

      - name: Verify graph can enter an empty project at the root
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          sys.path.insert(0, ".harness-tool")
          from engineering_graph import evaluate_engineering_target

          graph = yaml.safe_load(Path(".harness/engineering-graph.yaml").read_text())
          empty = {"artifacts": [], "questions": []}
          result = evaluate_engineering_target(graph, "IMPLEMENTATION", empty)

          assert result["status"] == "READY", result
          assert {item["capability"] for item in result["create"]} == {
              "nutrition-management.problem"
          }, result
          assert result["wait"] == [], result

          profile = {
              item["capability"]: item
              for item in result["profile"]["expectations"]
          }
          pending = {item["capability"] for item in result["pending"]}
          assert "nutrition-management.requirements" in pending, result
          assert "nutrition-management.architecture" in pending, result
          assert "nutrition-management.verification.strategy" in pending, result
          PY

      - name: Verify graph advances one frontier after problem acceptance
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          sys.path.insert(0, ".harness-tool")
          from engineering_graph import evaluate_engineering_target

          graph = yaml.safe_load(Path(".harness/engineering-graph.yaml").read_text())
          partial = {
              "artifacts": [{
                  "id": "PROBLEM",
                  "authority": "PRODUCT",
                  "path": "docs/problem.md",
                  "provides": ["nutrition-management.problem"],
                  "depends_on": [],
              }],
              "questions": [],
          }
          result = evaluate_engineering_target(graph, "IMPLEMENTATION", partial)
          assert result["status"] == "READY", result
          assert {item["capability"] for item in result["create"]} == {
              "nutrition-management.requirements"
          }, result
          PY

      - name: Verify existing implementation slices from one Engineering Graph
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          sys.path.insert(0, ".harness-tool")
          from engineering_graph import evaluate_engineering_target

          graph = yaml.safe_load(Path(".harness/engineering-graph.yaml").read_text())
          model = yaml.safe_load(Path(".harness/graph.yaml").read_text())

          for target in (
              "THEORETICAL-GAP-SUGGESTIONS",
              "NUTRIENT-EVIDENCE-PROPAGATION",
          ):
              result = evaluate_engineering_target(graph, target, model)
              assert result["status"] == "COMPLETE", (target, result)
              assert result["create"] == [], (target, result)
              assert result["wait"] == [], (target, result)
              assert result["pending"] == [], (target, result)
          PY

      - name: Verify BLS frontier is derived from production contracts
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          sys.path.insert(0, ".harness-tool")
          from engineering_graph import evaluate_engineering_target

          graph = yaml.safe_load(Path(".harness/engineering-graph.yaml").read_text())
          model = yaml.safe_load(Path(".harness/graph.yaml").read_text())
          result = evaluate_engineering_target(
              graph,
              "BLS-V4-PRODUCTION-IMPORT",
              model,
          )

          assert result["status"] == "READY", result
          assert {item["capability"] for item in result["create"]} == {
              "nutrition-management.food-knowledge.bls-v4.source-code-set"
          }, result
          assert result["wait"] == [], result

          pending = {item["capability"] for item in result["pending"]}
          assert {
              "nutrition-management.food-knowledge.bls-v4.category-assignment",
              "nutrition-management.food-knowledge.bls-v4.production-package-contract",
              "nutrition-management.food-knowledge.bls-v4.verification",
          }.issubset(pending), result
          PY

      - name: Verify BLS CREATE routes to pinned-source skill
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          sys.path.insert(0, ".harness-tool")
          from agent_router import route_create_work

          graph = yaml.safe_load(Path(".harness/engineering-graph.yaml").read_text())
          model = yaml.safe_load(Path(".harness/graph.yaml").read_text())
          registry = yaml.safe_load(
              Path(".harness-tool/skills/artifact-skill-registry-v0.yaml").read_text()
          )

          routed = route_create_work(
              graph,
              "BLS-V4-PRODUCTION-IMPORT",
              model,
              registry,
          )
          assert routed["target_status"] == "READY", routed
          assert routed["unrouted"] == [], routed
          assert len(routed["routed"]) == 1, routed
          item = routed["routed"][0]
          assert item["capabilities"] == [
              "nutrition-management.food-knowledge.bls-v4.source-code-set"
          ], item
          assert item["knowledge_kind"] == "pinned-source-entity-set", item
          assert item["skill"] == (
              "skills/artifacts/pinned-source-entity-set/SKILL.md"
          ), item
          PY
