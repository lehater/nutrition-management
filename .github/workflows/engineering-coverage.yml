# Coverage uses the canonical Harness SHA pinned below.
name: Engineering Coverage

on:
  push:
    branches:
      - main
    paths:
      - ".harness/**"
      - ".github/workflows/engineering-coverage.yml"
  pull_request:
    paths:
      - ".harness/**"
      - ".github/workflows/engineering-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Nutrition Management
        uses: actions/checkout@v5

      - name: Checkout Harness
        uses: actions/checkout@v5
        with:
          repository: lehater/harness
          ref: 90f80c2d670b894d7a0286d463ae7af451b3c948
          path: .harness-coverage-tool

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"

      - name: Install runtime dependency
        run: python -m pip install PyYAML

      - name: Evaluate backend coverage
        run: |
          python .harness-coverage-tool/engineering_coverage.py             .harness/engineering-graph.yaml             .harness/graph.yaml             IMPLEMENTATION             --scope current-design             --authority-aliases .harness/coverage/authority-role-aliases-v1.yaml             --overlay .harness/coverage/concern-activation-overlay-v1.yaml             --semantic-claim-bindings .harness/coverage/semantic-claim-bindings-v1.yaml             --subject-obligations .harness/coverage/backend-subject-obligations-v1.yaml             --scope-source docs/requirements/product-requirements.md             > /tmp/backend-coverage.json

      - name: Evaluate frontend coverage
        run: |
          python .harness-coverage-tool/engineering_coverage.py             .harness/engineering-graph.yaml             .harness/graph.yaml             FRONTEND-IMPLEMENTATION             --scope current-design             --authority-aliases .harness/coverage/authority-role-aliases-v1.yaml             --overlay .harness/coverage/concern-activation-overlay-v1.yaml             --semantic-claim-bindings .harness/coverage/semantic-claim-bindings-v1.yaml             --subject-obligations .harness/coverage/frontend-subject-obligations-v1.yaml             --scope-source docs/requirements/frontend-requirements.md             > /tmp/frontend-coverage.json

      - name: Verify complete coverage
        run: |
          python - <<'PY'
          import json

          with open("/tmp/backend-coverage.json", encoding="utf-8") as f:
              backend = json.load(f)
          with open("/tmp/frontend-coverage.json", encoding="utf-8") as f:
              frontend = json.load(f)

          for expected_consumer, result in (
              ("IMPLEMENTATION", backend),
              ("FRONTEND-IMPLEMENTATION", frontend),
          ):
              assert result["kind"] == "harness-engineering-coverage-evaluation"
              assert result["status"] == "canonical"
              assert result["consumer"] == expected_consumer
              assert result["completion_ready"] is True
              assert result["remaining_work_count"] == 0
              assert result["work_items"] == []
              assert result["question_frontier"] == []

          backend_concerns = {row["concern"] for row in backend["rows"]}
          frontend_concerns = {row["concern"] for row in frontend["rows"]}
          assert "interface.human.accessibility" not in backend_concerns
          assert "interface.human.accessibility" in frontend_concerns
          assert "data.model" in backend_concerns
          assert "data.model" in frontend_concerns

          print(
              "Nutrition Engineering Coverage COMPLETE:",
              backend["activated_count"],
              frontend["activated_count"],
          )
          PY
