name: Acquire BLS 4.0 source

on:
  pull_request:
    paths:
      - .github/workflows/acquire-bls-v4-source.yml

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download official BLS 4.0 package
        run: |
          python - <<'PY'
          from hashlib import sha256
          from html import unescape
          from pathlib import Path
          import re
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen
          from zipfile import ZipFile

          page_url = "https://blsdb.de/download"
          request = Request(page_url, headers={"User-Agent": "nutrition-management-source-build/1.0"})
          html = urlopen(request, timeout=60).read().decode("utf-8")
          matches = re.findall(r'href=["\']([^"\']*BLS_4_0_2025_DE\.zip[^"\']*)["\']', html)
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one BLS 4.0 ZIP link, found {len(matches)}")
          download_url = urljoin(page_url, unescape(matches[0]))

          out = Path("artifacts/bls-v4-source")
          out.mkdir(parents=True, exist_ok=True)
          zip_path = out / "BLS_4_0_2025_DE.zip"
          zip_request = Request(download_url, headers={"User-Agent": "nutrition-management-source-build/1.0"})
          zip_path.write_bytes(urlopen(zip_request, timeout=120).read())

          expected = {
              "BLS_4_0_Daten_2025_DE.xlsx",
              "BLS_4_0_Components_DE_EN.xlsx",
          }
          with ZipFile(zip_path) as archive:
              by_basename = {Path(name).name: name for name in archive.namelist() if not name.endswith("/")}
              missing = expected - set(by_basename)
              if missing:
                  raise SystemExit(f"official ZIP missing expected files: {sorted(missing)}")
              for filename in sorted(expected):
                  data = archive.read(by_basename[filename])
                  (out / filename).write_bytes(data)

          for path in sorted(out.iterdir()):
              if path.is_file():
                  print(path.name, sha256(path.read_bytes()).hexdigest(), path.stat().st_size)
          PY
      - name: Upload pinned source evidence
        uses: actions/upload-artifact@v4
        with:
          name: bls-v4-official-source
          path: artifacts/bls-v4-source/
          if-no-files-found: error
