name: Acquire BLS 4.0 official source once

on:
  push:
    branches:
      - impl/bls-v4-food-knowledge
    paths:
      - .github/workflows/acquire-bls-v4-source-once.yml

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Download official BLS source and current errata
        env:
          BLS_ZIP_URL: https://blsdb.de/assets/uploads/BLS_4_0_2025_DE.zip?token=XDT8-P98L-UAPV-FRBS-4CZQ-1KX0-5TZO-H76J
          BLS_ERRATA_URL: https://www.blsdb.de/assets/uploads/Erratum_BLS_4_0_DE.pdf?token=HLJ2-QK40-86FL-2UVD-GFRP-KYC5-3O3F-YP57
        run: |
          set -euo pipefail
          mkdir -p artifact/extracted
          curl --fail --location --retry 2 --user-agent 'nutrition-management-source-build/1.0' "$BLS_ZIP_URL" -o artifact/BLS_4_0_2025_DE.zip
          curl --fail --location --retry 2 --user-agent 'nutrition-management-source-build/1.0' "$BLS_ERRATA_URL" -o artifact/Erratum_BLS_4_0_DE.pdf
          unzip -q artifact/BLS_4_0_2025_DE.zip -d artifact/extracted
          find artifact/extracted -type f -maxdepth 3 -print | sort
          test "$(find artifact/extracted -type f -name 'BLS_4_0_Daten_2025_DE.xlsx' | wc -l)" -eq 1
          test "$(find artifact/extracted -type f -name 'BLS_4_0_Components_DE_EN.xlsx' | wc -l)" -eq 1
          (
            cd artifact
            sha256sum BLS_4_0_2025_DE.zip Erratum_BLS_4_0_DE.pdf > sha256.txt
            find extracted -type f -print0 | sort -z | xargs -0 sha256sum >> sha256.txt
          )
          cat artifact/sha256.txt

      - name: Upload pinned source evidence
        uses: actions/upload-artifact@v4
        with:
          name: bls-v4-official-source
          path: artifact/
          if-no-files-found: error
          retention-days: 1
