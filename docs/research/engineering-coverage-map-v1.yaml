  - concern: security.boundaries
    state: COVERED
    capabilities: [nutrition-management.frontend.security]
    artifacts: [FRONTEND-SECURITY]
  - concern: security.identity
    state: NOT_APPLICABLE
    rationale: Accepted local single-user frontend introduces no login/account identity boundary.
    evidence: [FRONTEND-REQUIREMENTS, FRONTEND-SECURITY]
  - concern: security.authorization
    state: NOT_APPLICABLE
    rationale: Accepted local single-user scope has no authorization model.
    evidence: [FRONTEND-REQUIREMENTS, FRONTEND-SECURITY]
  - concern: security.confidentiality
    state: COVERED
    artifacts: [FRONTEND-SECURITY]
    rationale: Diagnostics avoid full sensitive domain snapshots and no credentials are introduced in the current slice.
  - concern: security.integrity
    state: COVERED
    artifacts: [FRONTEND-SECURITY, DATA-DESIGN]
  - concern: security.accountability
    state: NOT_APPLICABLE
    rationale: No multi-user/account authority model exists in the accepted local slice.
    evidence: [FRONTEND-REQUIREMENTS, FRONTEND-SECURITY]
  - concern: security.availability-abuse
    state: COVERED
    artifacts: [FRONTEND-SECURITY]
    rationale: Host/origin/CSRF and fail-closed local binding cover the material accepted browser attack surface; no public-service DoS claim is made.
  - concern: security.threat-analysis
    state: UNASSESSED
    rationale: Security architecture exists but no explicit systematic threat-analysis artifact/evidence was found.
  - concern: security.vulnerability-management
    state: UNASSESSED
  - concern: security.secure-development
    state: COVERED
    artifacts: [ENGINEERING-DESIGN-POLICY, FRONTEND-VERIFICATION-DESIGN]
    rationale: Secure boundary/verification practices are explicit for implementation; this is not an SSDF maturity claim.

