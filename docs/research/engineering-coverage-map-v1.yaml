  - concern: data.lifecycle
    state: COVERED
    artifacts: [DATA-DESIGN, PRODUCT-REQUIREMENTS]
    rationale: Durable plan history is explicitly excluded; source/reference data and migrations have defined ownership. Broader retention policy is not implied.
