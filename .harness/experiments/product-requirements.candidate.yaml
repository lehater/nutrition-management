version: 1
kind: harness-knowledge-artifact
artifact: PRODUCT-REQUIREMENTS
schema: product-requirements/v0-experiment
title: Nutrition Management Product Requirements
research:
  source: docs/requirements/product-requirements.md
  capability_claims:
    - nutrition-management.requirements
content:
  purpose: >-
    Define the accepted MVP product behavior for an advisory system that calculates
    and compares feasible household purchase plans and their trade-offs rather than
    enforcing dietary rules.
  goals:
    - Support household nutrition targeting, food knowledge, purchasable market data, and deterministic purchase planning for one 30-day MVP period.
    - Produce one primary advisory purchase plan with explicit trade-offs, gaps, uncertainty, provenance and acquisition cost.
  requirement_groups:
    - id: household-nutrition-targeting
      title: Household nutrition targeting
      requirements:
        - Support a household with one or more members.
        - Support one current profile per member.
        - Support member source inputs including date of birth, sex, height, current weight, current-weight date, target weight, target date and physical activity.
        - Derive chronological age/applicable age band from date of birth at target-derivation time rather than requiring a separately entered development/growth stage.
        - Derive energy and macro-/micronutrient target specifications from those inputs while preserving source semantics for point references, bounds, ranges, relative formulas and separate safety limits.
        - Support a single MVP calculation period of 30 days.
        - Preserve individual member targets while aggregating compatible nutritional demand into the household target used by the MVP optimizer.
    - id: food-knowledge
      title: Food knowledge
      requirements:
        - Support a theoretical catalog of base foods with normalized nutrient profiles.
        - Support a canonical nutrient vocabulary/basis that permits deterministic comparison with active nutrition targets.
        - Preserve unknown/trace nutrient data separately from known zero values.
        - Support hierarchical food categories with stable top-level categories and extensible subcategories.
        - Preserve stable variety semantics that prevent negligible token quantities or package surplus from creating artificial category/food diversity.
        - Preserve nutrition-data provenance including at least a source name and optional URL/version/date, retaining nutrient-level provenance where available.
        - Use the theoretical catalog to suggest foods that could close mapped nutrient gaps when the purchasable catalog is insufficient.
    - id: purchasable-catalog-and-offers
      title: Purchasable catalog and offers
      requirements:
        - Support a concrete product/SKU based on a base food.
        - Support product-specific nutrient overrides over base-food defaults only after normalization to compatible nutrient semantics/basis.
        - Support real package size/quantity and enough quantity semantics to resolve an executable package to edible food mass for nutrition calculation.
        - Support multiple merchant/fulfilment-channel offers for the same SKU.
        - Support pickup and delivery fulfilment contexts with shared order-level conditions.
        - Preserve offer price/currency, availability, observation time and explicit validity interval when supplied by the source.
        - Preserve delivery/fulfilment cost, free-delivery threshold and minimum-order conditions when applicable.
        - Permit product, channel and offer data to be entered manually or imported; automatic acquisition from external services is not required for the MVP.
    - id: purchase-planning-and-optimization
      title: Purchase planning and optimization
      requirements:
        - Select executable products/offers that reasonably cover mapped energy, macro- and micronutrient targets for the 30-day household target.
        - Preserve unsupported target mappings and unknown nutrient evidence instead of reporting them as satisfied.
        - Distinguish purchased edible quantity from the quantity planned for use during the 30-day period.
        - Calculate nutritional coverage and variety from planned utilized quantity rather than unavoidable package surplus.
        - Consider product categories and diet variety rather than satisfying needs from a single cheapest source.
        - Consider nutritionally substitutable alternatives.
        - Choose concrete SKUs and offers globally across the whole basket rather than optimizing each line independently.
        - Calculate purchasable integer package counts and include unavoidable package surplus in plan cost without turning it into planned nutrition or inventory.
        - Group lines by fulfilment channel so delivery-related costs and minimum-order conditions are applied once at the appropriate order-group level.
        - Calculate total acquisition cost in one compatible currency without implicit FX conversion.
        - Prefer fewer purchase groups/merchants when nutritionally/variety-equivalent alternatives are close in acquisition cost.
        - Produce one primary recommended purchase plan for the MVP.
        - Return the best executable partial plan with explicit gaps/uncertainty when mapped targets or variety cannot all be satisfied.
        - Report mapped nutritional coverage and material deviations/gaps.
        - Report unsupported coverage dimensions separately.
        - Report safety-limit information only with claims justified by the aggregate/no-allocation model.
        - Report a budget estimate with price/condition observation provenance.
        - Suggest theoretical Base Foods for mapped positive nutrient gaps when the purchasable catalog cannot reasonably close them.
  constraints:
    - Nutrition standards are versioned data with source/provenance; one version is active by default in the MVP.
    - Safety upper limits remain distinguishable from desired/reference intake targets and are not interpreted as preferred target maxima.
    - Commercial observations without explicit expiry may be used for budget estimation with observation age/provenance preserved; the system must not imply a live-checkout price guarantee.
    - The optimizer balances nutritional coverage, energy fit, variety, total acquisition cost and procurement simplicity through an explicit deterministic policy rather than treating every nutrition reference as a universal hard constraint.
  acceptance_examples: []
  non_goals:
    - Pregnancy- or lactation-specific nutrition targeting.
    - Medical or therapeutic diet handling.
    - Allergies or intolerances.
    - Actual consumption tracking or calorie-tracker workflows.
    - Per-member allocation of purchased food or proof of individual allocation feasibility.
    - Household inventory, carry-over stock or leftovers.
    - Meal, recipe, cooking, portioning or storage planning.
    - Nutrient-loss modeling caused by cooking/preparation.
    - Transport/travel cost between stores.
    - FX conversion.
    - Coupons, loyalty/personalized pricing, subscriptions or complex promotion engines.
    - Multiple saved scenarios/profiles per member.
    - A Pareto-style shortlist of alternative plans in the first MVP output.
  evidence: []
