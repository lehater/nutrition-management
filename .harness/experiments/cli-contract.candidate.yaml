version: 1
kind: harness-knowledge-artifact
artifact: CLI-CONTRACT
schema: cli-contract/v0-experiment
title: Nutrition Management CLI Contract
research:
  source: docs/interface/cli-contract.md
  capability_claims:
    - nutrition-management.interface.cli
content:
  command: "nutrition-plan --db <sqlite-file> --household <household-id> --derivation-date <YYYY-MM-DD> --market-as-of <ISO-8601-instant>"
  arguments:
    - {name: "--db", required: true, semantics: "Path to the local file-backed SQLite database."}
    - {name: "--household", required: true, semantics: "Opaque household identifier."}
    - {name: "--derivation-date", required: true, semantics: "Nutrition-target derivation date."}
    - {name: "--market-as-of", required: true, semantics: "Explicit market observation instant used for offer executability."}
  success_semantics:
    - Stdout contains exactly one canonical JSON representation of the Purchase Plan.
    - Accepted domain outcomes are represented by the application result contract and canonical JSON.
  failure_classes:
    - id: usage
      conditions:
        - Argument parsing failure.
        - Date parsing failure.
        - Time parsing failure.
      result_semantics:
        - The invocation fails as a CLI usage failure.
    - id: technical
      conditions:
        - Application technical failure.
        - Persistence technical failure.
        - Solver technical failure.
      result_semantics:
        - The process result is non-success.
        - Technical failures are not serialized as accepted partial or no_executable_plan domain outcomes.
  representation_rules:
    - Object keys are sorted.
    - Output is compact and deterministic.
    - Decimal values are strings preserving decimal semantics.
    - Dates and timestamps are ISO-8601 strings.
    - Enum values use their canonical string value.
    - The CLI does not reinterpret or summarize provider/domain facts.
    - Derivation date and market-as-of are intentionally separate and neither may silently default to the current clock.
    - No stability guarantee is made for Python exception text or diagnostic stderr in the first slice.
  boundary_rules:
    - The CLI is an outer adapter.
    - It may parse invocation arguments.
    - It may create composition/infrastructure dependencies.
    - It may invoke the application use case.
    - It may serialize the returned result.
    - It may not query context tables.
    - It may not construct solver policy.
    - It may not derive nutrition semantics.
    - It may not contain business ranking rules.
  scope_exclusions:
    - HTTP API.
    - Browser UI.
    - Interactive shell.
    - Authentication.
    - Remote transport.
    - Adding a later interface creates a separate interface contract while preserving the application boundary.
