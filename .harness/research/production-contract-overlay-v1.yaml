version: 1
kind: harness-production-contract-overlay
project: NUTRITION-MANAGEMENT
status: research

# Research-only proposals. They are evaluated in memory by the Coverage
# evaluator and are not canonical Engineering Graph truth.
productions:
  - authority: DATA-DESIGN
    capability: nutrition-management.coverage.data-classification
    semantic_claims:
      - engineering.data.classification
    knowledge_kind: data-design
    requires:
      - nutrition-management.data-design

  - authority: DATA-DESIGN
    capability: nutrition-management.coverage.data-lifecycle
    semantic_claims:
      - engineering.data.lifecycle
    knowledge_kind: data-design
    requires:
      - nutrition-management.data-design

  - authority: IMPLEMENTATION-DESIGN
    capability: nutrition-management.coverage.backend-delivery-migration
    semantic_claims:
      - engineering.delivery.migration
    knowledge_kind: implementation-design
    requires:
      - nutrition-management.data-design
      - nutrition-management.redesign.implementation-design

  - authority: IMPLEMENTATION-DESIGN
    capability: nutrition-management.coverage.backend-delivery-release
    semantic_claims:
      - engineering.delivery.release
    knowledge_kind: implementation-design
    requires:
      - nutrition-management.redesign.implementation-design

  - authority: IMPLEMENTATION-DESIGN
    capability: nutrition-management.coverage.backend-delivery-rollback
    semantic_claims:
      - engineering.delivery.rollback
    knowledge_kind: implementation-design
    requires:
      - nutrition-management.redesign.implementation-design

  - authority: INTERFACE-DESIGN
    capability: nutrition-management.coverage.cli-compatibility
    semantic_claims:
      - engineering.interface.machine.compatibility
    knowledge_kind: interface-contract
    requires:
      - nutrition-management.interface.cli

  - authority: ENGINEERING-POLICY
    capability: nutrition-management.coverage.engineering-code-quality
    semantic_claims:
      - engineering.engineering.code-quality
    knowledge_kind: engineering-policy
    requires:
      - nutrition-management.engineering-policy
      - nutrition-management.component-design

  - authority: COMPONENT-DESIGN
    capability: nutrition-management.coverage.maintainability-testability
    semantic_claims:
      - engineering.quality.maintainability.testability
    knowledge_kind: component-design
    requires:
      - nutrition-management.component-design
      - nutrition-management.redesign.verification-design

  - authority: REDESIGN-VERIFICATION
    capability: nutrition-management.coverage.transition-revalidation
    semantic_claims:
      - engineering.transition.revalidation
    knowledge_kind: verification-strategy
    requires:
      - nutrition-management.redesign.verification-design
      - nutrition-management.redesign.test-design
      - nutrition-management.redesign.implementation-design

  - authority: REDESIGN-VERIFICATION
    capability: nutrition-management.coverage.requirement-traceability
    semantic_claims:
      - engineering.verification.requirement-traceability
    knowledge_kind: verification-strategy
    requires:
      - nutrition-management.requirements
      - nutrition-management.redesign.verification-design
